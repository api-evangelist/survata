description: Survata was a San Francisco market-research and brand-measurement company, backed by Bloomberg
  Beta, that ran online surveys and brand-lift studies to measure advertising effectiveness across digital
  channels. Survata was acquired by Upwave in 2019 and the brand has since been fully absorbed — survata.com
  now 301-redirects to upwave.com, the enterprise brand-measurement platform. No public developer API,
  documentation, developer portal, or well-known discovery surface is published for Survata or its Upwave
  successor; this profile is retained as a network lead with no live API surface.
